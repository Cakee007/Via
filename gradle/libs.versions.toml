[versions]
agp = "9.4.1"
tinypinyin = "2.0.3"
androidx-dynamicanimation = "1.0.0"
androidx-customview = "1.2.0"
androidx-fragment = "1.9.1"
androidx-activity = "1.13.0"
okhttp = "5.5.0"
zxing-core = "3.5.4"
zxing-embedded = "4.3.0"
androidx-webkit = "1.17.1"
androidx-recyclerview = "1.4.0"
androidx-viewpager2 = "1.1.0"
androidx-biometric = "1.1.0"

[libraries]
tinypinyin = { module = "com.github.promeg:tinypinyin", version.ref = "tinypinyin" }
androidx-dynamicanimation = { module = "androidx.dynamicanimation:dynamicanimation", version.ref = "androidx-dynamicanimation" }
androidx-customview = { module = "androidx.customview:customview", version.ref = "androidx-customview" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing-core" }
zxing-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing-embedded" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recyclerview" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "androidx-viewpager2" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidx-biometric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
